name: WOLF Bot

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  run-wolf:
    name: Run WOLF Bot

    runs-on: ubuntu-latest

    # 5 ساعات + هامش بسيط
    timeout-minutes: 310

    env:
      WOLF_API_TOKEN: ${{ secrets.WOLF_API_TOKEN }}
      WOLF_APP_CHECK_TOKEN: ${{ secrets.WOLF_APP_CHECK_TOKEN }}

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Node.js
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ======================================================
      # معلومات Node
      # ======================================================

      - name: Check Node.js
        run: |
          node --version
          npm --version


      # ======================================================
      # تثبيت المكتبات
      # ======================================================

      - name: Install dependencies
        run: npm install


      # ======================================================
      # التأكد من تثبيت wolf.js
      # ======================================================

      - name: Check wolf.js
        run: |
          node -e "import('wolf.js').then(m => console.log('wolf.js loaded successfully'))"


      # ======================================================
      # تشغيل البوت
      # ======================================================

      - name: Start WOLF bot
        run: npm start
```

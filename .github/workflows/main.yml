name: WOLF Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"

  push:
    branches:
      - main


# ============================================================
# مهم جدًا:
# يسمح بتشغيل نسخة واحدة فقط.
#
# عندما يبدأ Workflow جديد:
# GitHub يلغي النسخة السابقة تلقائيًا.
# ============================================================

concurrency:
  group: wolf-bot
  cancel-in-progress: true


jobs:
  run-wolf:
    name: Run WOLF Bot

    runs-on: ubuntu-latest

    # الحد الأقصى أكبر من 4 ساعات بقليل.
    # النسخة الجديدة ستلغي القديمة عند موعد الجدولة.
    timeout-minutes: 300

    env:
      WOLF_API_TOKEN: ${{ secrets.WOLF_API_TOKEN }}
      WOLF_APP_CHECK_TOKEN: ${{ secrets.WOLF_APP_CHECK_TOKEN }}

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Node.js
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ======================================================
      # Install FFmpeg
      # ======================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ======================================================
      # Check FFmpeg
      # ======================================================

      - name: Check FFmpeg
        run: |
          which ffmpeg
          ffmpeg -version


      # ======================================================
      # Check Node
      # ======================================================

      - name: Check Node.js
        run: |
          node --version
          npm --version


      # ======================================================
      # Install dependencies
      # ======================================================

      - name: Install dependencies
        run: npm install


      # ======================================================
      # Check wolf.js
      # ======================================================

      - name: Check wolf.js
        run: |
          node -e "import('wolf.js').then(() => console.log('✅ wolf.js loaded successfully')).catch(err => { console.error(err); process.exit(1); })"


      # ======================================================
      # Start WOLF bot
      # ======================================================

      - name: Start WOLF bot
        run: npm start

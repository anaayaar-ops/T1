name: WOLF Bot

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  run-wolf:
    name: Run WOLF Bot

    runs-on: ubuntu-latest

    timeout-minutes: 310

    env:
      WOLF_API_TOKEN: ${{ secrets.WOLF_API_TOKEN }}
      WOLF_APP_CHECK_TOKEN: ${{ secrets.WOLF_APP_CHECK_TOKEN }}

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Node.js
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ======================================================
      # Check Node.js
      # ======================================================

      - name: Check Node.js
        run: |
          node --version
          npm --version


      # ======================================================
      # Install dependencies
      # ======================================================

      - name: Install dependencies
        run: npm install


      # ======================================================
      # Check wolf.js
      # ======================================================

      - name: Check wolf.js
        run: |
          node -e "import('wolf.js').then(() => console.log('✅ wolf.js loaded successfully')).catch(err => { console.error(err); process.exit(1); })"


      # ======================================================
      # Start WOLF bot
      # ======================================================

      - name: Start WOLF bot
        run: npm start

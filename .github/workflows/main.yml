```yaml
name: WOLF Bot

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  run-wolf:
    runs-on: ubuntu-latest

    timeout-minutes: 310

    env:
      WOLF_API_TOKEN: ${{ secrets.WOLF_API_TOKEN }}
      WOLF_APP_CHECK_TOKEN: ${{ secrets.WOLF_APP_CHECK_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Node version
        run: node --version

      - name: Start WOLF bot
        run: node check-wolf.js
```

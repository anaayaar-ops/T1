name: WOLF Bot

on:
  workflow_dispatch:

jobs:
  wolf:
    runs-on: ubuntu-latest

    timeout-minutes: 300

    env:
      WOLF_TOKEN: ${{ secrets.WOLF_TOKEN }}
      WOLF_APP_CHECK_TOKEN: ${{ secrets.WOLF_APP_CHECK_TOKEN }}

      WOLF_DEVICE: web
      WOLF_IS_APP_CHECK_ENABLED: "true"

    steps:

      # ============================================
      # Checkout
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # Node.js 24
      # ============================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ============================================
      # Install dependencies
      # ============================================

      - name: Install dependencies
        run: npm install

      # ============================================
      # Verify configuration
      # ============================================

      - name: Verify configuration
        shell: bash
        run: |
          echo "========================================"
          echo "🐺 WOLF Bot"
          echo "========================================"

          node --version
          npm --version

          if [ -z "$WOLF_TOKEN" ]; then
            echo "❌ WOLF_TOKEN is missing"
            exit 1
          fi

          echo "✅ WOLF_TOKEN is configured"

          if [ "$WOLF_IS_APP_CHECK_ENABLED" = "true" ]; then
            if [ -z "$WOLF_APP_CHECK_TOKEN" ]; then
              echo "❌ WOLF_APP_CHECK_TOKEN is missing"
              exit 1
            fi

            echo "✅ App Check token is configured"
          else
            echo "ℹ️ App Check disabled"
          fi

      # ============================================
      # Start WOLF
      # ============================================

      - name: Start WOLF
        run: |
          echo "========================================"
          echo "🚀 Starting WOLF service"
          echo "========================================"

          node check-wolf.js

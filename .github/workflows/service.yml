name: WOLF Bot

on:
  workflow_dispatch:

jobs:
  wolf:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: npm install

      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          echo "========================================"
          echo "🔐 Checking WOLF Profile Secret"
          echo "========================================"

          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi

          echo "✅ WOLF_PROFILE_URL is available"

      - name: Start WOLF Bot
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
          WOLF_DEVICE: web
          WOLF_IS_APP_CHECK_ENABLED: "true"

        run: |
          echo "========================================"
          echo "🐺 Starting WOLF Bot"
          echo "========================================"

          npm start

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleanup"

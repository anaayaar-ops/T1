name: WOLF Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: wolf-bot
  cancel-in-progress: true

jobs:
  wolf:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Verify GH_READ_TOKEN
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          if [ -z "$GH_READ_TOKEN" ]; then
            echo "❌ GH_READ_TOKEN غير موجود في Secrets"
            exit 1
          fi
          echo "✅ GH_READ_TOKEN متوفر"

      - name: Run WOLF Bot
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          GH_OWNER: "anaayaar-ops"
          GH_REPO: "too"
          GH_FILE: "tokens.json"
          GH_BRANCH: "main"
        run: |
          echo "========================================"
          echo "🐺 WOLF BOT STARTING"
          echo "🕐 Start: $(date)"
          echo "========================================"
          npm start
          echo "🕐 End: $(date)"

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleanup"
          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true
          echo "✅ Done"

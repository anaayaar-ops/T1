name: WOLF Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: wolf-bot
  cancel-in-progress: true

jobs:
  wolf:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install System Dependencies (Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Project Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi
          echo "✅ WOLF_PROFILE_URL is available"

      # ======================================================
      # Run Bot (Forced Direct Download)
      # ======================================================
      - name: Run WOLF Event Task
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
          PROFILE_CACHE_DIR: ${{ github.workspace }}/profile-cache
          FORCE_FRESH_DOWNLOAD: "true"
        run: |
          echo "========================================"
          echo "🐺 WOLF BOT STARTING (FORCE DIRECT DOWNLOAD)"
          echo "🕐 Start time: $(date)"
          echo "========================================"
          
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" npm start
          
          EXIT_CODE=$?
          echo "🕐 End time: $(date)"
          exit $EXIT_CODE

      # ======================================================
      # Final Cleanup
      # ======================================================
      - name: Final Cleanup
        if: always()
        run: |
          echo "🧹 FINAL CLEANUP"
          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true
          pkill -TERM -f "Xvfb" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "Xvfb" 2>/dev/null || true
          echo "✅ Cleanup done"

name: WOLF Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"


# ============================================================
# نسخة واحدة فقط
# التشغيل الجديد يقتل السابق
# ============================================================

concurrency:
  group: wolf-bot
  cancel-in-progress: true


jobs:

  wolf:

    runs-on: ubuntu-latest

    timeout-minutes: 245

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Start WOLF Bot
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}

        run: |

          RUN_SECONDS=14400

          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + RUN_SECONDS))

          cleanup() {

            echo ""
            echo "========================================"
            echo "🧹 WOLF CLEANUP"
            echo "========================================"

            if [ -n "$BOT_PID" ]; then

              if kill -0 "$BOT_PID" 2>/dev/null; then

                echo "🛑 Stopping WOLF PID: $BOT_PID"

                kill -TERM -- "-$BOT_PID" 2>/dev/null || true

                sleep 5

                if kill -0 "$BOT_PID" 2>/dev/null; then

                  echo "💀 Force killing WOLF"

                  kill -KILL -- "-$BOT_PID" 2>/dev/null || true

                fi

              fi

            fi

            echo "✅ WOLF cleanup completed"
          }


          trap cleanup EXIT
          trap cleanup INT
          trap cleanup TERM


          echo "========================================"
          echo "🐺 STARTING WOLF"
          echo "========================================"

          setsid npm start &

          BOT_PID=$!

          echo "🐺 WOLF PID: $BOT_PID"


          while true; do

            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then

              echo "⏰ 4 hours completed"

              exit 0

            fi


            if ! kill -0 "$BOT_PID" 2>/dev/null; then

              echo "❌ WOLF stopped unexpectedly"

              wait "$BOT_PID" 2>/dev/null || true

              exit 1

            fi


            ELAPSED=$((NOW - START_TIME))

            HOURS=$((ELAPSED / 3600))
            MINUTES=$(((ELAPSED % 3600) / 60))

            echo "🐺 WOLF running: ${HOURS}h ${MINUTES}m"

            sleep 30
          fi

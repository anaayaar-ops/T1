name: WOLF Event Bot

on:
  schedule:
    - cron: '0 */4 * * *'   # كل 4 ساعات
  workflow_dispatch:

concurrency:
  group: wolf-event-bot
  cancel-in-progress: true   # يقتل النسخة السابقة عند بدء نسخة جديدة

jobs:
  wolf:
    runs-on: ubuntu-latest

    # 5 ساعات كحد أقصى (الحد المجاني 6 ساعات)
    timeout-minutes: 300

    steps:
      # ======================================================
      # Checkout
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # Node.js
      # ======================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ======================================================
      # Install Dependencies
      # ======================================================
      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm install
          echo "🌐 Installing Playwright Chromium..."
          npx playwright install --with-deps chromium
          echo "✅ Dependencies installed"

      # ======================================================
      # Restore Profile from Cache
      # ======================================================
      - name: Restore WOLF profile from cache
        id: profile-cache
        uses: actions/cache/restore@v4
        with:
          path: ./profile-cache
          key: wolf-profile-${{ github.run_id }}
          restore-keys: |
            wolf-profile-

      - name: Profile cache status
        run: |
          if [ -d "./profile-cache/user-data" ] && [ -n "$(ls -A ./profile-cache/user-data 2>/dev/null)" ]; then
            echo "✅ Cache موجود — سيتم استخدام البروفايل المُحدَّث"
            du -sh ./profile-cache/user-data || true
          else
            echo "ℹ️ لا يوجد Cache — سيتم التنزيل من Google Drive"
          fi

      # ======================================================
      # Check Profile URL
      # ======================================================
      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi
          echo "✅ WOLF_PROFILE_URL is available"

      # ======================================================
      # Run Bot
      # ======================================================
      - name: Run WOLF Event Task
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
          PROFILE_CACHE_DIR: ${{ github.workspace }}/profile-cache
        run: |
          echo "🕐 Start: $(date)"
          echo "🎯 DEVICE: web"
          echo "🛡️ APP CHECK: true"
          npm start
          EXIT_CODE=$?
          echo "🕐 End: $(date)"
          exit $EXIT_CODE

      # ======================================================
      # Save Refreshed Profile to Cache
      # ======================================================
      - name: Save WOLF profile to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./profile-cache
          key: wolf-profile-${{ github.run_id }}

      # ======================================================
      # Cleanup
      # ======================================================
      - name: Final Cleanup
        if: always()
        run: |
          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true
          sleep 2
          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true
          echo "✅ Cleanup done"

name: Service Runtime

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest

    timeout-minutes: 240

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Google Drive downloader
        run: python3 -m pip install --upgrade gdown

      - name: Download session
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          set -e

          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL secret is missing."
            exit 1
          fi

          echo "📥 Downloading session archive..."

          gdown "$WOLF_PROFILE_URL" \
            -O session.zip

          if [ ! -s session.zip ]; then
            echo "❌ Session archive is empty."
            exit 1
          fi

          echo "✅ Session archive downloaded."

          ls -lh session.zip

      - name: Start runtime
        env:
          WOLF_PROFILE_ZIP: ${{ github.workspace }}/session.zip
          WOLF_DEVICE: web
          WOLF_IS_APP_CHECK_ENABLED: "false"

        run: |
          node check-wolf.js

      - name: Cleanup session
        if: always()
        run: |
          rm -f session.zip
          rm -rf "$RUNNER_TEMP/service-session-runtime"

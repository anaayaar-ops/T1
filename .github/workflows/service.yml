name: WOLF Event Bot

on:
  workflow_dispatch:

concurrency:
  group: wolf-event-bot
  cancel-in-progress: true

jobs:
  wolf:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ======================================================
      # Node.js
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # ======================================================
      # Install Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          echo ""
          echo "========================================"
          echo "📦 Installing dependencies"
          echo "========================================"

          npm install

          echo ""
          echo "========================================"
          echo "🌐 Installing Playwright Chromium"
          echo "========================================"

          npx playwright install --with-deps chromium

          echo ""
          echo "========================================"
          echo "✅ Dependencies installed"
          echo "========================================"

      # ======================================================
      # Check Profile URL
      # ======================================================

      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          echo ""
          echo "========================================"
          echo "🔐 Checking WOLF Profile"
          echo "========================================"

          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi

          echo "✅ WOLF_PROFILE_URL is available"

          echo "========================================"

      # ======================================================
      # Run Bot
      # ======================================================

      - name: Run WOLF Event Task
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}
        run: |
          echo ""
          echo "========================================"
          echo "🐺 WOLF EVENT BOT"
          echo "========================================"

          echo "🕐 Start: $(date)"
          echo "🎯 المهمة: إنشاء الفعاليات + رفع الصور"
          echo "📱 DEVICE: web"
          echo "🛡️ APP CHECK: true"

          echo "========================================"

          npm start

          EXIT_CODE=$?

          echo ""
          echo "========================================"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ WOLF EVENT TASK COMPLETED"
            echo "🎯 تم تنفيذ المهمة بنجاح"
          else
            echo "❌ WOLF EVENT TASK FAILED"
            echo "Exit code: $EXIT_CODE"
          fi

          echo "🕐 End: $(date)"

          echo "========================================"

          exit "$EXIT_CODE"

      # ======================================================
      # Cleanup
      # ======================================================

      - name: Final Cleanup
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "🧹 FINAL CLEANUP"
          echo "========================================"

          echo "🛑 التأكد من عدم وجود WOLF process..."

          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true

          sleep 2

          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true

          echo ""
          echo "✅ Final cleanup completed"

          echo "========================================"

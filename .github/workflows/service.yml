name: WOLF Bot

# ============================================================
# تشغيل يدوي + تشغيل تلقائي كل 4 ساعات
# ============================================================

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"


# ============================================================
# نسخة WOLF واحدة فقط
#
# إذا بدأ تشغيل جديد:
# يتم إلغاء التشغيل السابق مباشرة
# ============================================================

concurrency:
  group: wolf-bot
  cancel-in-progress: true


# ============================================================
# JOB
# ============================================================

jobs:

  wolf:

    runs-on: ubuntu-latest

    # ========================================================
    # أقصى مدة للـ Runner
    # ========================================================

    timeout-minutes: 245


    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ======================================================
      # Node.js
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"


      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies
        run: |

          echo ""
          echo "========================================"
          echo "📦 Installing dependencies"
          echo "========================================"

          npm install

          echo ""
          echo "========================================"
          echo "✅ Dependencies installed"
          echo "========================================"


      # ======================================================
      # Check WOLF Profile
      # ======================================================

      - name: Check WOLF Profile Secret
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}

        run: |

          echo ""
          echo "========================================"
          echo "🔐 Checking WOLF Profile"
          echo "========================================"

          if [ -z "$WOLF_PROFILE_URL" ]; then
            echo "❌ WOLF_PROFILE_URL is NOT available"
            exit 1
          fi

          echo "✅ WOLF_PROFILE_URL is available"
          echo "========================================"


      # ======================================================
      # Start WOLF
      # ======================================================

      - name: Start WOLF Bot
        env:
          WOLF_PROFILE_URL: ${{ secrets.WOLF_PROFILE_URL }}

        run: |

          echo ""
          echo "========================================"
          echo "🐺 WOLF BOT STARTING"
          echo "========================================"

          echo "🕐 Start time: $(date)"
          echo "⏱️ Maximum runtime: 4 hours"
          echo "🔄 New workflow cancels previous workflow"
          echo "📱 DEVICE: web"
          echo "🛡️ APP CHECK: true"

          echo "========================================"


          # ====================================================
          # مدة تشغيل WOLF
          # 4 ساعات
          # ====================================================

          RUN_SECONDS=14400


          # ====================================================
          # Start time
          # ====================================================

          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + RUN_SECONDS))


          # ====================================================
          # Cleanup
          # ====================================================

          cleanup() {

            echo ""
            echo "========================================"
            echo "🧹 WOLF CLEANUP"
            echo "========================================"

            echo "🛑 Stopping WOLF..."


            if [ -n "$BOT_PID" ]; then

              if kill -0 "$BOT_PID" 2>/dev/null; then

                echo ""
                echo "🐺 WOLF PID: $BOT_PID"
                echo "📡 Sending SIGTERM..."

                # قتل Process Group بالكامل
                kill -TERM -- "-$BOT_PID" 2>/dev/null || true

                sleep 5

                if kill -0 "$BOT_PID" 2>/dev/null; then

                  echo "⚠️ WOLF is still running"
                  echo "💀 Sending SIGKILL..."

                  kill -KILL -- "-$BOT_PID" 2>/dev/null || true

                fi

              else

                echo "ℹ️ WOLF process already stopped"

              fi

            else

              echo "ℹ️ WOLF PID is not available"

            fi


            echo ""
            echo "✅ WOLF cleanup completed"
            echo "========================================"
          }


          # ====================================================
          # Signals
          # ====================================================

          trap cleanup EXIT
          trap cleanup INT
          trap cleanup TERM


          # ====================================================
          # Start WOLF
          # ====================================================

          echo ""
          echo "========================================"
          echo "🚀 STARTING WOLF"
          echo "========================================"

          echo "🕐 $(date)"
          echo "========================================"


          # تشغيل WOLF داخل Process Group منفصلة

          setsid npm start &

          BOT_PID=$!


          echo ""
          echo "🐺 WOLF PID: $BOT_PID"
          echo "🕐 Started: $(date)"
          echo "========================================"


          # ====================================================
          # Monitor WOLF
          # ====================================================

          while true; do

            NOW=$(date +%s)


            # ==================================================
            # انتهاء الأربع ساعات
            # ==================================================

            if [ "$NOW" -ge "$END_TIME" ]; then

              echo ""
              echo "========================================"
              echo "⏰ 4 HOURS COMPLETED"
              echo "========================================"

              echo "🕐 Current time: $(date)"
              echo "🛑 Stopping WOLF..."
              echo "========================================"

              exit 0

            fi


            # ==================================================
            # Check WOLF process
            # ==================================================

            if ! kill -0 "$BOT_PID" 2>/dev/null; then

              echo ""
              echo "========================================"
              echo "⚠️ WOLF STOPPED UNEXPECTEDLY"
              echo "========================================"

              wait "$BOT_PID" 2>/dev/null || true

              echo "❌ WOLF process is no longer running"
              echo "========================================"

              exit 1

            fi


            # ==================================================
            # Runtime
            # ==================================================

            ELAPSED=$((NOW - START_TIME))

            HOURS=$((ELAPSED / 3600))
            MINUTES=$(((ELAPSED % 3600) / 60))
            SECONDS=$((ELAPSED % 60))


            # ==================================================
            # Status
            # ==================================================

            echo ""
            echo "🐺 WOLF is running"
            echo "⏱️ Runtime: ${HOURS}h ${MINUTES}m ${SECONDS}s"
            echo "🕐 $(date)"
            echo "📱 DEVICE: web"
            echo "🛡️ APP CHECK: true"
            echo "========================================"


            # ==================================================
            # فحص كل 30 ثانية
            # ==================================================

            sleep 30

          done


      # ======================================================
      # Final Cleanup
      # ======================================================

      - name: Final Cleanup
        if: always()

        run: |

          echo ""
          echo "========================================"
          echo "🧹 FINAL CLEANUP"
          echo "========================================"

          echo "🛑 Cleaning current WOLF process..."


          pkill -TERM -f "node check-wolf.js" 2>/dev/null || true

          sleep 2

          pkill -KILL -f "node check-wolf.js" 2>/dev/null || true


          echo ""
          echo "✅ Final cleanup completed"
          echo "========================================"
